# Render blueprint for the MSM API.
#
# The client is NOT deployed here — it lives on Vercel, which proxies /api and
# /health to this service (see client/vercel.json) so the browser only ever sees
# one origin. That is deliberate: the session cookie is SameSite=Lax, and a Lax
# cookie is not sent on cross-site fetch, so calling this service directly from
# the Vercel origin would log users straight back out after login.

services:
  - type: web
    name: msm-api
    # Render appended a suffix because the bare subdomain was taken, so the
    # public URL is https://msm-api-jw9d.onrender.com — that is what
    # client/vercel.json must point at, not msm-api.onrender.com.
    runtime: ruby
    rootDir: server          # Ruby version comes from server/.ruby-version (3.3.5)
    region: oregon
    plan: free
    buildCommand: bundle install
    startCommand: bundle exec puma   # reads config/puma.rb; PORT is set by Render
    healthCheckPath: /health
    envVars:
      - key: RACK_ENV
        value: production

      # Generated once by Render and then held stable. Do NOT rotate it: it
      # signs session cookies AND peppers the six-digit code digests in
      # AccountService#digest, so changing it bricks any account that has
      # signed up but not yet verified.
      - key: SESSION_SECRET
        generateValue: true

      # Postgres is hosted on Supabase, not Render — Render's free database
      # expires. Paste Supabase's *connection pooler* string (not the direct
      # endpoint) into the Render dashboard: Database#with_connection opens a
      # new connection per request, which is what the pooler is built for.
      - key: DATABASE_URL
        sync: false

      # CLIENT_ORIGIN is deliberately unset: under the Vercel proxy there are
      # no cross-origin requests, so the CORS headers never come into play.

      # Mail is sent through Resend's HTTP API, not SMTP: Render blocks outbound
      # SMTP ports (25/465/587), so Net::SMTP fails there with Net::OpenTimeout.
      # Set both in the Render dashboard, never in this file.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

      # Google Drive backs GET /api/resources and the download route. Both are
      # required: ResourceProxy raises on a missing/blank value, the route
      # rescues it, and the browser sees a bare 502 — the real reason appears
      # only in the Render log as "Resource list failed (RuntimeError): ...".
      #
      # Point this at the PARENT folder: its subfolders become the groups on
      # the page, one level down only (Drive has no recursive query). A folder
      # with no subfolders still works and renders as a single ungrouped list.
      #
      # The folder must be shared with the service account's client_email
      # (Viewer is enough); sharing with your own account does nothing.
      # Sharing the parent cascades, so new subfolders need no config change.
      - key: GOOGLE_DRIVE_RESOURCES_FOLDER_ID
        sync: false

      # The whole service-account JSON key, pasted as ONE line. Render stores
      # it verbatim, so a value broken across lines fails JSON.parse and reads
      # as the same 502. GOOGLE_SERVICE_ACCOUNT_KEY_PATH is the local-only
      # alternative — there is no key file on Render to point it at.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
